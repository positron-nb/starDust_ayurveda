# PRAMAAN curated terminology (v1).
# Purpose: query expansion, concept tagging of passages, and the *heuristic* claim-support check.
# These are search aids, NOT clinical equivalences. English/Hindi aliases are approximate
# glosses; none of them asserts a one-to-one mapping to a modern diagnosis.
# Author: build assistant draft, 2026-11-07. Review status: pending (needs Ayurveda teammate).
# passage_patterns are Python regexes applied to the lower-cased original IAST text
# (NFC). "-?" allows the editorial compound hyphens used in the Aṣṭāṅgahṛdaya e-text.
version: "terms-2026.11.07.5"
review_status: pending
