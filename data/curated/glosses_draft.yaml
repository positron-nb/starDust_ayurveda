glosses:
  Ah.1.13.25: "When the digestive heat (ūṣman) is weak, the first dhātu (rasa) stays undigested; this vitiated rasa lodged in the āmāśaya is called āma."
  Ah.1.13.26: "Others say āma arises from the mutual mixing of excessively vitiated doṣas, as poison arises from kodrava grain."
  Ah.1.13.27: "Doṣas and dūṣyas contaminated by that āma are termed 'sāma', as are the diseases arising from it."
  Ah.1.13.23: "(Having confirmed doṣas have reached the koṣṭha, remove them by the nearest route.) Listed signs begin: obstruction of channels, loss of strength, heaviness, disturbed movement of vāta..."
  Ah.1.13.24: "...lassitude, indigestion (apakti), spitting, retention of wastes, loss of taste/appetite and fatigue are signs of malas with āma (sāma); the opposite indicates nirāma."
  Ah.1.13.28: "Sāma doṣas spread through the whole body and lodged in the dhātus, not yet loosened, should not be forcibly eliminated, just as juice is not extracted from an unripe fruit."
  Ah.1.13.29: "(Forced removal) would damage their seat because they are hard to remove; they should first be prepared with pācana and dīpana measures, oleation and sudation."
  Ah.1.8.1: "One should always eat in proper measure; proper measure is what keeps Agni functioning. The measure depends on the substances, whether heavy or light."
  Ah.1.8.2: "For heavy foods, half-satiety; for light foods, not to excess. The proper measure is the amount that is digested comfortably."
  Ah.1.8.3: "Food in deficient quantity does not support strength, growth and ojas, and becomes a cause of all vāta disorders."
  Ah.1.8.4: "Excessive quantity quickly provokes all the doṣas."
  Ah.1.8.5: "Entering that same improperly digested (āma) food, the provoked doṣas produce alasaka by obstructing it, or viṣūcikā by expelling it."
  Ah.1.8.13: "Daṇḍālasaka is described as rapidly fatal and to be avoided (as untreatable). In one habitually eating incompatible food, eating before the previous meal is digested, or with indigestion, (āma develops) signs like poison..."
  Ah.1.8.14: "...this very dangerous āmadoṣa called 'āmaviṣa' should be avoided (as untreatable) because it acts quickly like poison and calls for contradictory treatments."
  Ah.1.8.18: "Even with severe pain, a person with indigestion (ajīrṇa) should not take pain-relieving medicine; Agni overwhelmed by āma cannot digest doṣa, medicine and food together."
